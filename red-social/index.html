<!-- Mini red social, donde yo pueda escribir mi nombre y un post y luego con el boton enviar pueda mostrar mi post -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
 </head>
 <body>
    <main class="container">
        <h1 id="title">Mini red social</h1>
        <form action="" method="post">
            <label for="name"></label>
            <input type="text" id="name" placeholder="Escribe tu nombre">
            <br>
            <label for="mensaje"></label>
            <textarea name="mensaje" id="mensaje" placeholder="Escribe una publicación"></textarea>
            <br>
            <button id="btn-post">Publicar</button>
        </form>
        <div id="contenedor-post">
            <!-- Aqui se espera un div con h2 y  -->
        </div>
    </main>
    <script src="script.js"></script>
 </body>
 </html>
